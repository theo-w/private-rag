# 多源知识库配置示例：复制为 config/sources.yaml 后按需修改。
# 数据库密码等敏感信息请通过 ${ENV_VAR} 注入，不要写进仓库。
sources:
  - type: file
    path: data/docs
    tags: [local]
    # include: ["*.md", "*.pdf"]   # 可选：只入库匹配的文件

  - type: web
    urls:
      - https://example.com/
    timeout: 15
    tags: [web]

  - type: sql
    dsn: ${DEMO_DATABASE_URL:-sqlite:///data/sql/demo.db}
    query: SELECT id, name, category, description, price, updated_at FROM products ORDER BY id
    id_column: id
    title_column: name
    content_columns: [name, category, description, price]
    updated_at_column: updated_at
    label: demo.products
    max_rows: 5000
    tags: [business]
    # 可选：允许 v7 agentic 问答在运行时只读查询本库（默认 false）
    # 只允许单条 SELECT、表白名单与行数上限；DSN 仍应使用只读数据库账号
    # allow_runtime_query: true
    # runtime_tables: [products]   # 留空则由上面 query 的 FROM 子句推导
